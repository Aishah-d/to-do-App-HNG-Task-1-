<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mute:#5b6577;--line:#d6dce6;--acc:#1f4fd8;--on:#fff;--high:#c62828;--med:#a35d00;--low:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#172033;--ink:#e8edf7;--mute:#9aa6bd;--line:#2a3550;--acc:#6f97ff;--on:#0e1420;--high:#ff8a8a;--med:#ffb454;--low:#6fd08c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 96px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
li.high{border-left-color:var(--high)}li.medium{border-left-color:var(--med)}li.low{border-left-color:var(--low)}
li input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--acc)}
.title{font-weight:600;word-break:break-word}
li.done .title{text-decoration:line-through;color:var(--mute)}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--mute)}
.late{color:var(--high);font-weight:600}
details{grid-column:2}
summary{cursor:pointer;font-size:.85rem;color:var(--acc)}
details p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:4px}
.acts button{border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--mute)}
.acts button:hover{background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:32px 8px}
.fab{position:fixed;right:16px;bottom:16px;padding:14px 20px;border:0;border-radius:999px;background:var(--acc);color:var(--on);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.foot{display:flex;gap:8px;margin-top:20px;font-size:.85rem}
.foot button,.foot label{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
dialog{width:min(520px,calc(100% - 24px));border:0;border-radius:14px;padding:20px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px}
dialog label{display:block;font-size:.9rem;margin:10px 0 4px;color:var(--mute)}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btns button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer}
.btns .go{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Taskboard</h1>
  <p class="sub" id="sub"></p>
  <div class="bar"><i id="fill"></i></div>

  <div class="tools">
    <input type="search" id="q" placeholder="Search tasks and notes" aria-label="Search">
    <select id="sort" aria-label="Sort tasks">
      <option value="created">Newest first</option>
      <option value="due">Due date</option>
      <option value="priority">Priority</option>
    </select>
  </div>
  <div class="tabs" id="tabs">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <button id="export">Export backup</button>
    <label>Import backup<input type="file" id="import" accept="application/json" hidden></label>
    <button id="clear">Clear completed</button>
  </div>
</main>

<button class="fab" id="add">+ New task</button>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dtitle">New task</h2>
    <label for="f-title">Title</label>
    <input type="text" id="f-title" required maxlength="140">
    <label for="f-notes">Notes</label>
    <textarea id="f-notes" rows="4"></textarea>
    <div class="row">
      <div><label for="f-pri">Priority</label>
        <select id="f-pri"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
      <div><label for="f-due">Due date</label><input type="date" id="f-due"></div>
    </div>
    <label for="f-rep">Repeat</label>
    <select id="f-rep"><option value="">Doesn't repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>
    <div class="btns">
      <button type="button" id="cancel">Cancel</button>
      <button class="go" type="submit">Save task</button>
    </div>
  </form>
</dialog>

<script>
const KEY = "taskboard.v1";
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
let filter = "all", editing = null;
const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };
const fmt = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => fmt(new Date());
function nextDue(due, rep) {
  const base = due ? new Date(due + "T00:00:00") : new Date();
  const day = base.getDate();
  let d = new Date(base), guard = 0;
  do {
    if (rep === "daily") d.setDate(d.getDate() + 1);
    else if (rep === "weekly") d.setDate(d.getDate() + 7);
    else {
      d.setDate(1); d.setMonth(d.getMonth() + 1);
      d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    }
  } while (fmt(d) < today() && ++guard < 500);
  return fmt(d);
}
const rank = { high: 0, medium: 1, low: 2 };

function visible() {
  const q = $("q").value.trim().toLowerCase();
  let out = tasks.filter(t =>
    (filter === "all" || (filter === "done") === t.done) &&
    (!q || (t.title + " " + t.notes).toLowerCase().includes(q)));
  const s = $("sort").value;
  out.sort((a, b) => {
    if (a.done !== b.done) return a.done - b.done;
    if (s === "due") return (a.due || "9999").localeCompare(b.due || "9999");
    if (s === "priority") return rank[a.priority] - rank[b.priority];
    return b.created - a.created;
  });
  return out;
}

function el(tag, props, ...kids) {
  const n = Object.assign(document.createElement(tag), props || {});
  kids.forEach(k => k && n.append(k));
  return n;
}

function render() {
  const list = $("list");
  list.replaceChildren();
  const items = visible();
  if (!items.length) {
    list.append(el("li", { className: "empty", style: "display:block;border-left-color:var(--line)" },
      tasks.length ? "No tasks match this view." : "No tasks yet. Tap “New task” to add your first one."));
  }
  items.forEach(t => {
    const cb = el("input", { type: "checkbox", checked: t.done, ariaLabel: "Mark done: " + t.title });
    cb.onchange = () => {
      t.done = cb.checked;
      if (t.done && t.repeat && !t.spawned) {
        t.spawned = true;
        tasks.push({ id: Date.now() + Math.random(), title: t.title, notes: t.notes, priority: t.priority,
          repeat: t.repeat, due: nextDue(t.due, t.repeat), done: false, created: Date.now() });
      }
      save(); render();
    };
    const late = t.due && !t.done && t.due < today();
    const meta = el("div", { className: "meta" },
      el("span", { textContent: t.priority[0].toUpperCase() + t.priority.slice(1) + " priority" }),
      t.due && el("span", { className: late ? "late" : "", textContent: (late ? "Overdue: " : "Due ") + t.due }),
      t.repeat && el("span", { textContent: "Repeats " + t.repeat }));
    const edit = el("button", { textContent: "Edit", ariaLabel: "Edit " + t.title });
    edit.onclick = () => openDlg(t);
    const del = el("button", { textContent: "Delete", ariaLabel: "Delete " + t.title });
    del.onclick = () => { if (confirm("Delete “" + t.title + "”?")) { tasks = tasks.filter(x => x.id !== t.id); save(); render(); } };
    const li = el("li", { className: t.priority + (t.done ? " done" : "") },
      cb, el("div", { className: "title", textContent: t.title }), el("div", { className: "acts" }, edit, del), meta,
      t.notes && el("details", {}, el("summary", { textContent: "Notes" }), el("p", { textContent: t.notes })));
    list.append(li);
  });
  const done = tasks.filter(t => t.done).length;
  $("sub").textContent = tasks.length ? done + " of " + tasks.length + " done" : "Nothing planned yet";
  $("fill").style.width = tasks.length ? (done / tasks.length * 100) + "%" : "0";
}

function openDlg(t) {
  editing = t || null;
  $("dtitle").textContent = t ? "Edit task" : "New task";
  $("f-title").value = t ? t.title : "";
  $("f-notes").value = t ? t.notes : "";
  $("f-pri").value = t ? t.priority : "medium";
  $("f-due").value = t ? t.due : "";
  $("f-rep").value = t ? (t.repeat || "") : "";
  $("dlg").showModal();
  $("f-title").focus();
}

$("add").onclick = () => openDlg();
$("cancel").onclick = () => $("dlg").close();
$("form").onsubmit = () => {
  const title = $("f-title").value.trim();
  if (!title) return;
  const data = { title, notes: $("f-notes").value.trim(), priority: $("f-pri").value, due: $("f-due").value, repeat: $("f-rep").value };
  if (editing) Object.assign(editing, data);
  else tasks.push({ id: Date.now() + Math.random(), done: false, created: Date.now(), ...data });
  save(); render();
};
$("q").oninput = render;
$("sort").onchange = render;
$("tabs").onclick = e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  [...$("tabs").children].forEach(b => b.setAttribute("aria-pressed", b === e.target));
  render();
};
$("clear").onclick = () => {
  const n = tasks.filter(t => t.done).length;
  if (n && confirm("Delete " + n + " completed task(s)?")) { tasks = tasks.filter(t => !t.done); save(); render(); }
};
$("export").onclick = () => {
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" })), download: "taskboard-backup.json" });
  a.click(); URL.revokeObjectURL(a.href);
};
$("import").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(txt => {
    const data = JSON.parse(txt);
    if (!Array.isArray(data)) throw 0;
    tasks = data.filter(t => t && typeof t.title === "string").map(t => ({
      id: t.id || Date.now() + Math.random(), title: t.title, notes: t.notes || "",
      priority: rank[t.priority] !== undefined ? t.priority : "medium", due: t.due || "", repeat: ["daily", "weekly", "monthly"].includes(t.repeat) ? t.repeat : "",
      done: !!t.done, spawned: !!t.spawned, created: t.created || Date.now() }));
    save(); render();
  }).catch(() => alert("That file isn't a valid Taskboard backup."));
  e.target.value = "";
};
render();
</script>
</body>
</html>
